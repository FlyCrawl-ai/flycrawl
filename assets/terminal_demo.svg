<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .code-text { font-family: -apple-system, BlinkMacSystemFont, "JetBrains Mono", "Fira Code", monospace; font-size: 14px; line-height: 1.6; }
    .dim { fill: #8b949e; }
    .cmd { fill: #79c0ff; font-weight: bold; }
    .url { fill: #a5d6ff; }
    .flag { fill: #ff7b72; }
    .success { fill: #3fb950; font-weight: bold; }
    .badge { fill: #f0883e; }
    .markdown { fill: #c9d1d9; }
    .title { fill: #58a6ff; font-weight: bold; font-size: 15px; }
    .tok { fill: #d2a8ff; }
  </style>

  <!-- Window Container -->
  <rect x="20" y="20" width="860" height="440" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Titlebar -->
  <rect x="20" y="20" width="860" height="42" rx="12" fill="#161b22"/>
  <rect x="20" y="50" width="860" height="12" fill="#161b22"/>
  <line x1="20" y1="62" x2="880" y2="62" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="44" cy="41" r="6.5" fill="#ff5f56"/>
  <circle cx="66" cy="41" r="6.5" fill="#ffbd2e"/>
  <circle cx="88" cy="41" r="6.5" fill="#27c93f"/>

  <!-- Titlebar Text -->
  <text x="450" y="46" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">zsh — flycrawl-cli v3.5 (high-speed engine)</text>

  <!-- Terminal Content -->
  <g class="code-text" transform="translate(48, 96)">
    <!-- Prompt & Command -->
    <text x="0" y="0">
      <tspan class="dim">➜  </tspan>
      <tspan class="success">~</tspan>
      <tspan class="dim"> </tspan>
      <tspan class="cmd">curl</tspan>
      <tspan class="dim"> -s -X POST </tspan>
      <tspan class="url">https://flycrawl.net/api/v1/scrape</tspan>
      <tspan class="dim"> \</tspan>
    </text>
    <text x="24" y="24">
      <tspan class="dim">-H </tspan><tspan fill="#a5d6ff">"Authorization: Bearer fc_live_79a9...014"</tspan><tspan class="dim"> \</tspan>
    </text>
    <text x="24" y="48">
      <tspan class="dim">-d </tspan><tspan fill="#7ee787">'{"url": "https://stripe.com/pricing", "formats": ["fit_markdown"]}'</tspan>
    </text>

    <!-- Execution Stats Bar -->
    <rect x="0" y="70" width="804" height="34" rx="6" fill="#21262d" stroke="#388bfd" stroke-width="1" stroke-opacity="0.3"/>
    <text x="14" y="92">
      <tspan class="success">✔ HTTP 200 OK</tspan>
      <tspan class="dim">  |  ⚡ Latency: </tspan><tspan class="success">42ms</tspan>
      <tspan class="dim">  |  Raw: </tspan><tspan class="dim">480 KB</tspan>
      <tspan class="dim"> ➔ Clean: </tspan><tspan class="tok">4.2 KB (-99.1%)</tspan>
      <tspan class="dim">  |  Bypass: </tspan><tspan class="badge">Cloudflare Turnstile ✔</tspan>
    </text>

    <!-- Markdown Output Window Preview -->
    <text x="0" y="136" class="title"># Stripe: Global Payment Processing Pricing</text>
    <text x="0" y="162" class="markdown">Access a complete payments platform with simple, pay-as-you-go pricing.</text>
    <text x="0" y="188" class="markdown">- **Standard Rate**: 2.9% + 30¢ per successful card charge</text>
    <text x="0" y="214" class="markdown">- **Supported Methods**: Cards, Apple Pay, Google Pay, Bank Transfers</text>
    <text x="0" y="240" class="markdown">- **Zero Hidden Fees**: No setup, monthly, or hidden subscription costs</text>
    <text x="0" y="270" class="dim">─────────────────────────────────────────────────────────────────────────────</text>
    <text x="0" y="296">
      <tspan class="dim">Tokens consumed: </tspan><tspan class="tok">1,120 tokens</tspan>
      <tspan class="dim"> (Saved </tspan><tspan class="success">118,880 tokens</tspan><tspan class="dim"> vs raw HTML)</tspan>
    </text>
  </g>
</svg>
