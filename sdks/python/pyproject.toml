[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flycrawl-py"
version = "1.0.0"
description = "Official Python SDK for FlyCrawl - High-Performance Web Scraping & Markdown Extraction for AI"
readme = "README.md"
authors = [
    { name = "FlyCrawl Team", email = "core@flycrawl.ai" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0"
]
keywords = ["web-scraping", "llm", "markdown", "crawler", "ai", "agents", "firecrawl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://flycrawl.net"
Documentation = "https://flycrawl.net/docs"
Repository = "https://github.com/flycrawl-ai/flycrawl"
